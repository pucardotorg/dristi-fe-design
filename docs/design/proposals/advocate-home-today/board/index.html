<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advocate Home board</title>
<style>
  :root {
    --bg: #f3f2ee; --dot: #d9d6cc; --ink: #1d1d1b; --mut: #77756d; --line: #c9c6bb;
    --box: #ffffff; --fill: #e9e7e0; --fill2: #dcd9cf; --note: #fff3b8; --noteInk: #5b4a00;
    --pin: #e0592a; --flag: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; cursor: grab;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 24px 24px; }
  #view.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .abs { position: absolute; }

  /* Board furniture */
  .title h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: -0.5px; }
  .title p { font-size: 20px; margin: 0; color: var(--mut); }
  .label { font-size: 22px; font-weight: 700; margin-bottom: 14px; white-space: nowrap; }
  .label span { font-weight: 400; color: var(--mut); margin-left: 10px; font-size: 18px; }
  .note { white-space: pre-line; background: var(--note); color: var(--noteInk); padding: 12px 14px; border-radius: 4px;
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.06); font-size: 16px; width: 260px; }
  .note b { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 50%; background: var(--pin); color: #fff; font-size: 12px; margin-right: 8px; }
  .pin { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: #fff;
    font: 700 12px/24px system-ui; text-align: center; box-shadow: 0 0 0 3px rgba(224,89,42,.25); z-index: 2; }

  /* Wireframe primitives */
  .frame { background: var(--box); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .chrome { height: 36px; border-bottom: 1.5px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--mut); font-size: 12px; }
  .rail { position: absolute; left: 0; top: 36px; bottom: 0; width: 64px; border-right: 1.5px solid var(--line); background: #fbfaf7; }
  .rail i { display: block; width: 26px; height: 8px; background: var(--fill2); border-radius: 4px; margin: 18px auto; }
  .page { position: absolute; left: 64px; right: 0; top: 36px; bottom: 0; padding: 22px 26px; }
  .phone .page { position: static; padding: 14px; }
  .hdr { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
  .hdr small { color: var(--mut); display: block; font-size: 12px; }
  .hdr h2 { margin: 2px 0 0; font-size: 22px; }
  .flows { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { border: 1.5px solid var(--ink); border-radius: 6px; padding: 5px 10px; font-size: 12px; background: #fff; white-space: nowrap; }
  .btn.solid { background: var(--ink); color: #fff; }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #fff; position: relative; }
  .q { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .q .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .q h3 { margin: 0; font-size: 14px; }
  .q .meta { margin-left: auto; color: var(--mut); font-size: 11px; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #eeece6; font-size: 12.5px; }
  .row:first-of-type { border-top: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t div:last-child { color: var(--mut); font-size: 11px; }
  .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--fill); flex: none; }
  .due { color: var(--mut); font-size: 11px; white-space: nowrap; }
  .due.red { color: var(--flag); font-weight: 700; }
  .flag { color: var(--flag); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .chip { display: inline-block; border: 1.2px solid var(--ink); border-radius: 10px; padding: 0 6px; font-size: 11px; margin-right: 3px; }
  .track { position: relative; height: 4px; background: var(--fill); border-radius: 2px; margin: 6px 0 2px; }
  .track > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mut); border-radius: 2px; }
  .track > em { position: absolute; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transform: translateX(-50%); }
  .track > em.r { border-color: var(--flag); }
  .more { color: var(--mut); font-size: 11.5px; padding-top: 6px; }
  .link { font-size: 11.5px; text-decoration: underline; }
  .empty { color: var(--mut); font-size: 12.5px; padding: 4px 0 2px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { border: 1.2px solid var(--line); border-radius: 6px; padding: 6px 4px; text-align: center; font-size: 11px; }
  .day.on { border: 2px solid var(--ink); }
  .day b { display: block; font-size: 12px; }
  .day span { color: var(--mut); display: block; }

  /* Controls */
  #ui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 10; }
  #ui button { font: 600 14px system-ui; border: 1.5px solid var(--ink); background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  #hint { position: fixed; left: 16px; bottom: 16px; color: var(--mut); font-size: 13px; z-index: 10; background: rgba(243,242,238,.9); padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="view"><div id="world"></div></div>
<div id="hint">Drag to move · scroll or pinch to zoom</div>
<div id="ui"><button id="out" aria-label="Zoom out">−</button><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="r2">Round 2</button><button id="r3">Round 3</button><button id="r4">Round 4</button><button id="r5">Round 5</button><button id="r6">Round 6</button><button id="r7">Round 7</button><button id="r8">Round 8</button><button id="r9">Round 9</button><button id="r10">Round 10</button><button id="r11">Round 11</button><button id="r12">Round 12</button></div>

<script>
/* ── Example data (sandbox names; low fidelity) ───────────────────────── */
const STATES = {
  busy: {
    name: "Busy day", sub: "Friday, 6 courts listed",
    courts: [
      { c: "Court A", at: 9, items: [14, 22], flagged: [[14, "Fathima Beevi v. Anil Kumar K.", "Not ready: process fee unpaid"]] },
      { c: "Court B", at: 1, items: [3, 11], flagged: [] },
      { c: "Court C", at: 20, items: [26], flagged: [[26, "Lakshmi Menon v. P. J. Thomas", "Passed over on Monday, listed again today"]] },
      { c: "Court D", at: 0, items: [7], flagged: [] },
    ], moreCourts: 2,
    tasks: [
      ["File the reply to the objection", "Muralidharan P. v. Sherin Thomas", "Window closes today", true, "File"],
      ["Pay the process fee for the summons", "Fathima Beevi v. Anil Kumar K. · item 14", "Before item 14", true, "Pay"],
      ["Pay the copying fee", "Kerala Agro Mart v. Biju Varghese", "2 days overdue", true, "Pay"],
      ["Sign the bail application", "Anitha Joseph v. Latheef M.", "Due today", false, "Sign"],
      ["Produce PW-2 for cross-examination", "Lakshmi Menon v. P. J. Thomas", "Due today", false, "Mark done"],
    ], moreTasks: 7,
    waiting: [
      ["Proof affidavit", "Lakshmi Menon v. P. J. Thomas", "Prepared by Rahul Iyer, yesterday", "Sign"],
      ["Vakalatnama", "Sree Durga Traders v. Ajmal K.", "Prepared by S. Prakash, today", "Sign"],
      ["Request to remove you from the case", "Nimmy George v. Saji Kurian", "Raised by Deepa Varghese", "Respond"],
    ],
    know: [
      ["Sree Durga Traders v. Ajmal K.", "Summons served on the accused"],
      ["Nimmy George v. Saji Kurian", "Adjournment application rejected"],
      ["Objection invited", "Discharge application · due Thu"],
    ], moreKnow: 5,
    week: [["Fri", 8, 6, true], ["Sat", 0, 1], ["Mon", 7, 4], ["Tue", 5, 3], ["Wed", 3, 2], ["Thu", 6, 2], ["Fri", 4, 1]],
  },
  light: {
    name: "Light day", sub: "One court, little due",
    courts: [{ c: "Court B", at: 2, items: [6], flagged: [] }], moreCourts: 0,
    tasks: [["Pay the court fee", "Jaya Textiles v. Noufal A.", "Due today", false, "Pay"]], moreTasks: 0,
    waiting: [],
    know: [["Aiswarya Agencies v. Deepa Mohan", "Next date set: 2 Dec"]], moreKnow: 0,
    week: [["Fri", 1, 1, true], ["Sat", 0, 0], ["Mon", 4, 2], ["Tue", 2, 0], ["Wed", 0, 1], ["Thu", 3, 0], ["Fri", 2, 0]],
  },
  none: {
    name: "No court today", sub: "Saturday, or nothing listed",
    courts: [], next: "Next listed: Monday · 7 hearings in 3 courts", moreCourts: 0,
    tasks: [
      ["Correct 2 defects and re-file", "Malabar Steels v. Rafeeq T.", "Due Mon", false, "Re-file"],
      ["Pay the copying fee", "Kerala Agro Mart v. Biju Varghese", "2 days overdue", true, "Pay"],
    ], moreTasks: 0, tasksTitle: "Nothing due today. Coming up first:",
    waiting: [["Proof affidavit", "Lakshmi Menon v. P. J. Thomas", "Prepared by Rahul Iyer, yesterday", "Sign"]],
    know: [], moreKnow: 0,
    week: [["Sat", 0, 0, true], ["Mon", 7, 4], ["Tue", 5, 3], ["Wed", 3, 2], ["Thu", 6, 2], ["Fri", 4, 1], ["Sat", 0, 0]],
  },
};

/* ── Wireframe pieces ──────────────────────────────────────────────────── */
const q = (n, title, meta = "") =>
  `<div class="q"><span class="n">${n}</span><h3>${title}</h3>${meta ? `<span class="meta">${meta}</span>` : ""}</div>`;

function courtsCard(s) {
  const items = (c) => (c.items.length === 1 ? `Item ${c.items[0]}` : `Items ${c.items.slice(0, -1).join(", ")} and ${c.items.at(-1)}`);
  const ahead = (c) => {
    if (!c.at) return "Not sitting yet";
    const next = c.items.find((i) => i > c.at);
    return next ? `On item ${c.at} · ${next - c.at - 1} before yours` : "Your matters heard";
  };
  const body = s.courts.length
    ? s.courts.map(c => `
      <div class="row" style="display:block">
        <div style="display:flex;gap:8px;align-items:baseline">
          <b style="font-size:12.5px;min-width:56px">${c.c}</b>
          <span>${items(c)}</span>
          <span class="due" style="margin-left:auto">${ahead(c)}</span>
        </div>
        ${c.flagged.map(([i, t, why]) => `<div style="margin:4px 0 0 64px;font-size:11.5px"><span>Item ${i} · ${t}</span><div class="flag">${why}</div></div>`).join("")}
      </div>`).join("") + (s.moreCourts ? `<div class="more">+${s.moreCourts} more courts · <span class="link">Open hearings</span></div>` : "")
    : `<div class="empty">Nothing listed today.</div><div class="row"><div class="t"><div>${s.next}</div></div><span class="link">Open hearings</span></div>`;
  return `<div class="card">${q(1, "Where you need to be", s.courts.length ? `${s.courts.length + s.moreCourts} courts` : "")}${body}</div>`;
}

function tasksCard(s) {
  const rows = s.tasks.map(([t, sub, due, red, verb]) => `
    <div class="row"><span class="ic"></span><div class="t"><div>${t}</div><div>${sub}</div></div>
    <span class="due ${red ? "red" : ""}">${due}</span><span class="btn">${verb}</span></div>`).join("");
  const head = s.tasksTitle ? `<div class="empty">${s.tasksTitle}</div>` : "";
  const more = s.moreTasks ? `<div class="more">+${s.moreTasks} more today · <span class="link">Take action</span></div>` : "";
  return `<div class="card">${q(2, "Must do today", s.tasks.length && !s.tasksTitle ? "worst first" : "")}${head}${rows}${more}</div>`;
}

function waitingCard(s) {
  const body = s.waiting.length
    ? s.waiting.map(([what, kase, who, verb]) => `<div class="row"><span class="ic"></span><div class="t"><div>${what} · ${kase}</div><div>${who}</div></div><span class="btn">${verb}</span></div>`).join("")
    : `<div class="empty">Nothing waiting on you.</div>`;
  return `<div class="card">${q(3, "Waiting on you")}${body}</div>`;
}

function knowCard(s) {
  const body = s.know.length
    ? s.know.map(([c, w]) => `<div class="row"><div class="t"><div>${w}</div><div>${c}</div></div><span class="link">Open</span></div>`).join("") +
      (s.moreKnow ? `<div class="more">+${s.moreKnow} more updates</div>` : "")
    : `<div class="empty">No updates since yesterday.</div>`;
  return `<div class="card">${q(4, "Updates on your cases", "since yesterday, newest first")}${body}</div>`;
}

function weekCard(s) {
  return `<div class="card">${q(5, "Coming up")}<div class="week">${s.week
    .map(([d, m, due, on]) => `<div class="day ${on ? "on" : ""}"><b>${on ? "Today" : d}</b><span>${m} hearings</span><span>${due} tasks due</span></div>`)
    .join("")}</div></div>`;
}

function header(phone) {
  const flows = `<div class="flows"><span class="btn solid">File a case</span><span class="btn">Raise application</span><span class="btn">Join a case</span><span class="btn">Vakalatnama</span></div>`;
  return phone
    ? `<div style="margin-bottom:14px"><small style="color:var(--mut);font-size:12px">Friday, 13 Nov</small><h2 style="margin:2px 0 10px;font-size:20px">Good morning, Anjali</h2>${flows}</div>`
    : `<div class="hdr"><div><small>Friday, 13 November</small><h2>Good morning, Anjali</h2></div>${flows}</div>`;
}

function desktop(s) {
  return `<div class="frame" style="width:1200px;height:800px;position:relative">
    <div class="chrome">DRISTI · Home</div><div class="rail"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="page">${header(false)}
      <div class="cols">
        <div class="stack">${courtsCard(s)}${tasksCard(s)}</div>
        <div class="stack">${waitingCard(s)}${knowCard(s)}${weekCard(s)}</div>
      </div>
    </div></div>`;
}

function phone(s) {
  return `<div class="frame phone" style="width:390px;position:relative">
    <div class="chrome">DRISTI · Home</div>
    <div class="page"><div class="stack">${header(true)}${courtsCard(s)}${tasksCard(s)}${waitingCard(s)}${knowCard(s)}${weekCard(s)}</div></div></div>`;
}

/* ── Board layout ──────────────────────────────────────────────────────── */
const world = document.getElementById("world");
const place = (x, y, html, w) => {
  const el = document.createElement("div");
  el.className = "abs";
  el.style.left = x + "px"; el.style.top = y + "px";
  if (w) el.style.width = w + "px";
  el.innerHTML = html;
  world.appendChild(el);
  return el;
};
const note = (x, y, text, n) => place(x, y, `<div class="note">${n ? `<b>${n}</b>` : ""}${text}</div>`);
const pin = (x, y, n) => place(x, y, `<div class="pin">${n}</div>`);

place(0, 0, `<div class="title"><h1>Advocate Home</h1><p>Five fixed questions, same order every day. Low fidelity.</p></div>`, 1400);

// The frame, as a strip of the five questions
place(0, 130, `<div style="display:flex;gap:10px">${[
  "Where you need to be", "Must do today", "Waiting on you", "Updates on your cases", "Coming up",
].map((t, i) => `<div class="note" style="width:220px;background:#fff;border:1.5px solid var(--ink);color:var(--ink)"><b>${i + 1}</b>${t}</div>`).join("")}</div>`);

note(1210, 120, "Order follows the clock: court is morning, work through the day, then the rest.");

// Row 1: desktop, three states
const Y = 300, GAP = 1500;
["busy", "light", "none"].forEach((k, i) => {
  const s = STATES[k];
  place(i * GAP, Y, `<div class="label">${s.name}<span>${s.sub}</span></div>`);
  place(i * GAP, Y + 50, desktop(s));
});

// Annotations on the busy desktop (frame top-left = 0, Y+50; page starts x 64+26, y 36+22)
const fx = 0, fy = Y + 50;
note(fx - 300, fy + 140, "A line per court. A matter only shows when something is wrong with it, with the reason.", 1);
note(fx - 300, fy + 460, "Top 5 in the product's urgency order. Act here.", 2);
note(fx + 1230, fy + 90, "What it is, which case, who prepared it.", 3);
note(fx + 1230, fy + 330, "Every update since yesterday, not a pick. Picking \"notable\" needs typed updates from the backend.", 4);
note(fx + 1230, fy + 600, "Hearings listed and tasks due, per day.", 5);
note(fx + 1230, fy + 230, "Not ready is flagged in ①. The fix lives in ②. One place to act.");

// What differs in the other states
note(GAP + 1230, fy + 120, "Empty questions stay, in one line. The shape never changes.");
note(2 * GAP + 1230, fy + 120, "No court: ① names the next listed day.");
note(2 * GAP + 1230, fy + 260, "Nothing due today: ② shows what's due first.");

// Row 2: phones
const PY = Y + 1000;
place(0, PY, `<div class="label">Phone<span>same order, 1 → 5</span></div>`);
place(0, PY + 50, phone(STATES.busy));
place(520, PY + 50, phone(STATES.none));
note(960, PY + 60, "Stacks 1 → 5. Flows stay on top.");
note(960, PY + 200, "Caps don't change on a phone.");

// Rules
const RX = 1500, RY = PY + 50;
place(RX, PY, `<div class="label">Rules<span>what keeps it deterministic</span></div>`);
[
  "Fixed order: ① to ⑤. Every day.",
  "One sort rule per question.",
  "Each item appears once. ② wins over ③.",
  "Every question has a cap and a way in.",
  "Only data advocate screens already show.",
].forEach((t, i) => note(RX + (i % 3) * 290, RY + Math.floor(i / 3) * 110, t));

/* ── Round 2: visual ───────────────────────────────────────────────────── */
const V = {
  courts: [
    { c: "Court A", at: 9, last: 40, mine: [{ i: 14, bad: "Fee unpaid" }, { i: 22 }] },
    { c: "Court B", at: 1, last: 18, mine: [{ i: 3 }, { i: 11 }] },
    { c: "Court C", at: 20, last: 32, mine: [{ i: 26, bad: "Passed over Mon" }] },
    { c: "Court D", at: 0, last: 25, mine: [{ i: 7 }] },
  ],
};
const RED = "#c0392b", AMB = "#d68910", INK = "#1d1d1b", MUT = "#77756d", TRK = "#e9e7e0";

/* Option A: the court's list as a labelled bar. */
function courtBar(c, w = 520) {
  const px = (n) => Math.round((n / c.last) * w);
  const now = c.at
    ? `<div style="position:absolute;left:${px(c.at)}px;top:-16px;transform:translateX(-50%);font-size:10px;color:${INK};font-weight:700;white-space:nowrap">Now ${c.at}</div>
       <div style="position:absolute;left:${px(c.at)}px;top:-3px;width:2px;height:14px;background:${INK}"></div>`
    : `<div style="position:absolute;left:0;top:-16px;font-size:10px;color:${MUT}">Not sitting yet</div>`;
  const flags = c.mine.map((m) => `
    <div style="position:absolute;left:${px(m.i)}px;top:12px;transform:translateX(-50%);text-align:center">
      <div style="width:2px;height:6px;background:${m.bad ? RED : INK};margin:0 auto"></div>
      <div style="border:1.5px solid ${m.bad ? RED : INK};color:${m.bad ? RED : INK};background:#fff;border-radius:4px;padding:0 5px;font:700 11px/16px system-ui">${m.i}</div>
      ${m.bad ? `<div style="font-size:10px;color:${RED};white-space:nowrap;margin-top:2px">${m.bad}</div>` : ""}
    </div>`).join("");
  return `<div style="display:flex;gap:12px;align-items:flex-start;padding:22px 0 30px;border-top:1px solid #eeece6">
    <b style="font-size:12.5px;width:58px;flex:none">${c.c}</b>
    <div style="position:relative;width:${w}px;height:8px;background:${TRK};border-radius:4px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${px(c.at)}px;background:#b7b4aa;border-radius:4px"></div>
      ${now}${flags}
      <div style="position:absolute;left:0;top:12px;font-size:9px;color:${MUT}">1</div>
      <div style="position:absolute;right:0;top:12px;font-size:9px;color:${MUT}">${c.last}</div>
    </div></div>`;
}

/* Option B: the wait as countable dots, then your item. */
function courtDots(c) {
  const next = c.mine.find((m) => m.i > c.at);
  const ahead = next ? (c.at ? next.i - c.at - 1 : next.i - 1) : 0;
  const shown = Math.min(ahead, 12);
  const dots = Array.from({ length: shown }, () => `<span style="width:9px;height:9px;border-radius:50%;background:#b7b4aa;display:inline-block"></span>`).join("");
  const tag = (m) => `<span style="border:1.5px solid ${m.bad ? RED : INK};color:${m.bad ? RED : INK};border-radius:4px;padding:0 5px;font:700 11px/16px system-ui">${m.i}</span>`;
  return `<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #eeece6;font-size:12px">
    <b style="width:58px;flex:none">${c.c}</b>
    <span style="width:96px;flex:none;color:${MUT}">${c.at ? `Now ${c.at}` : "Not sitting"}</span>
    <span style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;width:150px">${dots}${ahead > 12 ? `<span style="color:${MUT}">+${ahead - 12}</span>` : ""}</span>
    <span style="width:70px;color:${MUT}">${ahead} to go</span>
    ${next ? tag(next) : ""}
    ${next && next.bad ? `<span style="color:${RED};font-size:11px">${next.bad}</span>` : ""}
    <span style="margin-left:auto;color:${MUT}">${c.mine.filter((m) => m !== next).map((m) => `then ${m.i}`).join(" ")}</span>
  </div>`;
}

/* ② urgency as coloured bands, counted on top. */
function vTasks() {
  const bands = [["Overdue or closes today", 3, RED], ["Before court today", 2, AMB], ["Due today", 7, "#b7b4aa"]];
  const tot = bands.reduce((n, b) => n + b[1], 0);

  if (tasks.some(([, , l]) => l === 0)) return "onday";

/* November 2026 as a plain month calendar. Past days coloured by the day's tasks;
   today and tomorrow dashed (still to do); the rest of the month plain. */
function monthView() {
  const byDay = {};
  DUE9.slice(1).forEach(([d, , tasks]) => (byDay[d] = tasks)); // 1 to 12 Nov
  const lead = 6; // 1 Nov 2026 is a Sunday; Monday-first grid
  /* Calendar convention: the date sits small in the corner. The middle carries the state,
     as a tint plus an icon, so no number in the middle can be read as a count. */
  const TINT = { ahead: ["#e6f2e7", GRN, "✓"], onday: ["#fbf0dc", AMB, "•"], late: ["#f9e1de", RED, "!"], none: ["#f4f3ef", MUT, ""] };
  const date = (d, c) => `<span style="position:absolute;top:4px;left:6px;font:600 10.5px system-ui;color:${c}">${d}</span>`;
  const base = "position:relative;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:default";
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(`<span></span>`);
  for (let d = 1; d <= 30; d++) {
    if (d === 13 || d === 14) {
      const o = OPEN9[d === 13 ? 0 : 1];
      cells.push(`<span data-tip="${o[0]}, ${d} Nov · ${o[2].length} still to do\n${o[2].map(([x]) => x).join("\n")}" style="${base};border:2px dashed ${INK}">${date(d, INK)}<span style="font:600 10px system-ui;color:${INK};margin-top:10px">${o[0]}</span></span>`);
    } else if (d > 14) {
      cells.push(`<span style="${base};border:1px solid var(--line)">${date(d, MUT)}</span>`);
    } else {
      const tasks = byDay[d] || [];
      const st = dayState(tasks);
      const [bg, fg, icon] = TINT[st];
      const tip = tasks.length ? `Due ${d} Nov · ${tasks.length} task${tasks.length === 1 ? "" : "s"}\n` + tasks.map(([x, when, l]) => `${x} · ${when}, ${doneWord(l)}`).join("\n") : `${d} Nov · nothing due`;
      cells.push(`<span data-tip="${tip}" style="${base};background:${bg}">${date(d, st === "none" ? MUT : fg)}${icon ? `<span style="font:800 15px system-ui;color:${fg};margin-top:8px">${icon}</span>` : ""}</span>`);
    }
  }
  const past = Object.entries(byDay).filter(([d, t]) => t.length && Number(d) <= 12);
  const thisWeek = past.filter(([d]) => Number(d) >= 9);
  const ahead = (arr) => arr.filter(([, t]) => dayState(t) === "ahead").length;
  const key = [["ahead", "Done ahead"], ["onday", "Done on the due day"], ["late", "Done late or still overdue"]];
  return `<div style="display:flex;flex-direction:column;gap:2px;font-size:12.5px;margin-bottom:10px">
      <span><b>This week: ${ahead(thisWeek)} of ${thisWeek.length} due days done ahead.</b> <span style="color:${MUT}">November so far: ${ahead(past)} of ${past.length}.</span></span>
      <span style="color:${RED}">1 still overdue, due Wed 11.</span></div>
    <div style="font:700 12.5px system-ui;margin-bottom:6px">November 2026 · <span style="font-weight:400;color:${MUT}">each day shows the tasks due on it</span></div>
    <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:5px">
      ${WD.map((n) => `<span style="font-size:10.5px;color:${MUT};text-align:center">${n}</span>`).join("")}
      ${cells.join("")}
    </div>
    <div style="display:flex;gap:12px;font-size:11px;color:${MUT};margin-top:10px">${key.map(([k, l]) => `<span><span style="display:inline-flex;width:14px;height:14px;border-radius:3px;background:${TINT[k][0]};color:${TINT[k][1]};font:800 10px/14px system-ui;justify-content:center;margin-right:4px">${TINT[k][2]}</span>${l}</span>`).join("")}<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px dashed ${INK};margin-right:4px;vertical-align:-2px"></i>Still to do</span></div>`;
}

const zoomAt = (cx, cy, k) => {
  const ns = Math.min(2.5, Math.max(0.08, s * k));
  x = cx - (cx - x) * (ns / s); y = cy - (cy - y) * (ns / s); s = ns; apply();
};
view.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  else { x -= e.deltaX; y -= e.deltaY; apply(); }
}, { passive: false });
let drag = null;
view.addEventListener("pointerdown", (e) => { if (e.target.closest("[data-ui]")) return; drag = { px: e.clientX, py: e.clientY, x, y }; view.classList.add("drag"); view.setPointerCapture(e.pointerId); });
view.addEventListener("pointermove", (e) => { if (!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; apply(); });
view.addEventListener("pointerup", () => { drag = null; view.classList.remove("drag"); });
document.getElementById("in").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
document.getElementById("out").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
function fit() {
  const w = world.scrollWidth + 400, h = world.scrollHeight + 200;
  s = Math.min(innerWidth / w, innerHeight / h); x = 40 + 300 * s; y = 30; apply();
}
document.getElementById("fit").onclick = fit;
